services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chatai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chatai
      POSTGRES_PASSWORD: chatai
      POSTGRES_DB: chatai
    volumes:
      - chatai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatai -d chatai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://chatai:chatai@db:5432/chatai
      BETTER_AUTH_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    volumes:
      - chatai_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  chatai_pgdata:
  chatai_uploads:
