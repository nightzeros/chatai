services:
  db:
    image: pgvector/pgvector:pg17
    container_name: chatai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chatai
      POSTGRES_PASSWORD: chatai
      POSTGRES_DB: chatai
    volumes:
      - chatai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatai -d chatai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://chatai:chatai@db:5432/chatai
      BETTER_AUTH_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    volumes:
      - chatai_uploads:/app/uploads
    # Voice drains live calls for up to 8 s on SIGTERM; Docker's default 10 s is too tight.
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Optional offline LLM + embeddings. Start with:
  #   docker compose --profile local-models up --build
  # Then pull models (see README / .env.example offline block).
  ollama:
    profiles: [local-models]
    image: ollama/ollama
    container_name: chatai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chatai_pgdata:
  chatai_uploads:
  ollama_data:
