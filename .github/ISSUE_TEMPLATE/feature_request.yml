name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: milestone
    attributes:
      label: Related milestone (if known)
      options:
        - Unsure
        - v0.1 Core RAG
        - v0.2 Embeddable
        - v0.3 Observability
        - Later / post-1.0
