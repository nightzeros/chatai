name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: milestone
    attributes:
      label: Related milestone (if known)
      options:
        - Unsure
        - v1.x maintenance
        - Post-1.0 — AI Actions / Tools
        - Post-1.0 — Human handoff
        - Post-1.0 — Leads
        - Post-1.0 — Teams / organizations
        - Post-1.0 — Multi-language
        - Docs / DX only
