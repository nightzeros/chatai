name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Release checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chatai
          POSTGRES_PASSWORD: chatai
          POSTGRES_DB: chatai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatai -d chatai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://chatai:chatai@127.0.0.1:5432/chatai
      BETTER_AUTH_SECRET: ci-build-secret-at-least-32-chars-long
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migration upgrade path
        run: pnpm test:migrations

      - name: Widget release gate meta-check
        run: pnpm ci:widget-release

      - name: Build
        run: pnpm build

      - name: Build docs site
        run: pnpm docs:build

      - name: Verify hosted widget asset
        run: pnpm widget:check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare browser fixtures
        run: |
          pnpm migrate
          pnpm e2e:seed

      - name: Smoke hosted widget over HTTP
        run: |
          set -euo pipefail
          pnpm --filter @chatai/web start > /tmp/chatai-web.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            # pnpm exits before next start; free :3000 so Playwright e2e can bind.
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --dump-header /tmp/widget-headers \
              --output /tmp/widget-chat.js \
              http://127.0.0.1:3000/widget/chat.js; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Production server did not serve /widget/chat.js" >&2
              cat /tmp/chatai-web.log >&2
              exit 1
            fi
            sleep 2
          done

          grep -Eiq '^content-type:.*javascript' /tmp/widget-headers
          pnpm widget:check -- /tmp/widget-chat.js

      - name: Chromium browser tests
        run: pnpm e2e
