name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (requires npm environment approval)
        type: boolean
        default: false
      dry_run:
        description: npm publish --dry-run (no registry upload)
        type: boolean
        default: true

concurrency:
  group: publish-npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `next build` imports the auth module, which requires these at page-data
    # collection. Placeholders only; validate never connects to a database.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://chatai:chatai@127.0.0.1:5432/chatai
      BETTER_AUTH_SECRET: ci-build-secret-at-least-32-chars-long
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: "pnpm"

      - name: Install npm (Trusted Publishing minimum)
        run: npm --version && npm install -g npm@11.5.1 && npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync package versions
        run: pnpm packages:sync-versions

      - name: Verify package versions match VERSION
        run: node scripts/sync-package-versions.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build monorepo
        run: pnpm build

      - name: Verify hosted widget asset
        run: pnpm widget:check

      - name: Verify npm packages (build + pack)
        run: pnpm packages:verify

      - name: Verify tarball install smoke
        run: pnpm packages:verify-install

      - name: Verify npm publish workflow gates
        run: node scripts/check-publish-npm-workflow.mjs

      - name: Upload packed tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-${{ github.sha }}
          path: /tmp/chatai-npm-pack/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: validate
    if: >-
      github.repository == 'nightzeros/chatai' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == true)
      ) &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      did_publish: ${{ steps.publish_mode.outputs.did_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          cache: "pnpm"

      - name: Install npm (Trusted Publishing minimum)
        run: npm --version && npm install -g npm@11.5.1 && npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync package versions
        run: pnpm packages:sync-versions

      - name: Verify package versions match VERSION
        run: node scripts/sync-package-versions.mjs --check

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          expected="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$expected" ]; then
            echo "Tag v$tag does not match VERSION ($expected)" >&2
            exit 1
          fi

      - name: Build publishable packages
        run: pnpm packages:build

      - name: Determine publish mode
        id: publish_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "did_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "did_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run publish manifests
        if: steps.publish_mode.outputs.mode == 'dry-run'
        run: node scripts/publish-npm-packages.mjs --dry-run

      - name: Publish (OIDC + provenance)
        if: steps.publish_mode.outputs.mode == 'publish'
        run: |
          node scripts/publish-npm-packages.mjs --dry-run
          node scripts/publish-npm-packages.mjs --publish

  verify-registry:
    name: Verify npm registry
    needs: publish
    if: needs.publish.outputs.did_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Install npm
        run: npm install -g npm@11.5.1

      - name: Verify published packages on registry
        run: node scripts/verify-npm-registry.mjs
