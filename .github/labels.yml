# Labels for GitHub Issues / PRs
#
# Apply with: gh label create … or GitHub UI / actions.
# Keep this file as the source of truth for community triage.

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: security
  color: "ee0701"
  description: Security-related report or fix

- name: api
  color: "5319e7"
  description: /api/v1 contract or SDK

- name: widget
  color: "fbca04"
  description: Embeddable widget / React package

- name: rag
  color: "0e8a16"
  description: Retrieval, ingestion, evals

- name: self-hosting
  color: "1d76db"
  description: Docker, ops, migrations

- name: breaking-change
  color: "b60205"
  description: Requires major version bump

- name: needs-triage
  color: "ededed"
  description: Needs maintainer triage
