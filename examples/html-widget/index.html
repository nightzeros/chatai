<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatAI hosted widget example</title>
  </head>
  <body>
    <main>
      <h1>ChatAI hosted widget</h1>
      <p>
        Replace <code>CHATAI_ORIGIN</code> and <code>CHATAI_ASSISTANT_ID</code> in the
        script tag below (defaults target a local ChatAI app). See README.md.
      </p>
    </main>
    <script
      src="http://localhost:3000/widget/chat.js"
      data-assistant-id="asst_replace_me"
      async
    ></script>
  </body>
</html>
