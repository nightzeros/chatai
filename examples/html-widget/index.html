<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatAI hosted widget example</title>
  </head>
  <body>
    <main>
      <h1>ChatAI hosted widget</h1>
      <p>
        Replace <code>data-assistant-id</code> with the assistant <strong>public ID</strong> from
        Dashboard → Install (it looks like <code>asst_…</code>). The committed value
        <code>asst_replace_me</code> is a placeholder and will show “Assistant not found.”
      </p>
    </main>
    <script
      src="http://localhost:3000/widget/chat.js"
      data-assistant-id="asst_replace_me"
      async
    ></script>
  </body>
</html>
